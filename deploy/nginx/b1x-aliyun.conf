# 方案 B：整个站点搬到阿里云（推荐，最省事）
# /b1x/       → 静态（app/ + p2/web/）
# /b1x/api/   → 反代到本机引擎（去掉前缀）
server {
    listen 443 ssl http2;
    server_name qhqiqi.cn www.qhqiqi.cn;

    ssl_certificate     /etc/letsencrypt/live/qhqiqi.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qhqiqi.cn/privkey.pem;

    # ---------- 静态 ----------
    location = /b1x { return 301 /b1x/; }
    location /b1x/ {
        alias /var/www/b1x/;          # 把仓库根目录内容同步到这里
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";   # 演示期别让评委看到旧页面
    }

    # ---------- 接口 ----------
    location /b1x/api/ {
        proxy_pass http://127.0.0.1:8787/;    # 末尾斜杠：/b1x/api/match → /match
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /b1x/api/health { proxy_pass http://127.0.0.1:8787/health; }
}
