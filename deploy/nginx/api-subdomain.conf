# 方案 A：静态继续留 GitHub Pages，只把接口放到子域 api.qhqiqi.cn
server {
    listen 443 ssl http2;
    server_name api.qhqiqi.cn;

    ssl_certificate     /etc/letsencrypt/live/api.qhqiqi.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.qhqiqi.cn/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8787/;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin "*" always;
    }
}
