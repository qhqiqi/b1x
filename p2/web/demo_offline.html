<!doctype html>
<html lang="zh-CN">

<style>

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  .wrap{max-width:430px;margin:0 auto;padding:18px 16px 60px}
  h1{font-size:19px;margin:6px 0 2px}
  .sub{color:var(--dim);font-size:12.5px;margin-bottom:16px}
  .search{display:flex;gap:8px;margin-bottom:10px}
  input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:12px 13px;font-size:15px;outline:none}
  input:focus{border-color:var(--acc)}
  button{background:var(--acc);border:0;border-radius:10px;color:#fff;padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer}
  button:active{opacity:.85}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
  .chip{background:#1d2130;border:1px solid var(--line);color:var(--dim);border-radius:99px;padding:6px 11px;font-size:12.5px;cursor:pointer}
  .chip:hover{color:var(--txt);border-color:#3a4256}
  .meta{display:flex;gap:8px;align-items:center;margin:14px 0 10px;font-size:12.5px;color:var(--dim)}
  .badge{border-radius:6px;padding:2px 7px;font-size:11.5px;font-weight:600}
  .b-rule{background:#12321f;color:var(--ok)} .b-ask{background:#3a2a12;color:var(--warn)}
  .b-export{background:#12263d;color:#6fb0ff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px}
  .row1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .sku{font-size:15.5px;font-weight:700;letter-spacing:.2px}
  .conf{font-size:12px;border-radius:6px;padding:2px 7px}
  .c-高{background:#12321f;color:var(--ok)} .c-中{background:#3a2a12;color:var(--warn)} .c-低{background:#2a2f3a;color:var(--dim)}
  .dims{color:#b9c3d6;font-size:13.5px;margin-top:3px;font-variant-numeric:tabular-nums}
  .reason{color:var(--dim);font-size:12.5px;margin-top:7px}
  .ev{color:#6f7a90;font-size:12px;margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
  .flags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .f{font-size:11px;border-radius:5px;padding:2px 6px;background:#232838;color:#9fb0cc}
  .f-v{background:#12321f;color:var(--ok)} .f-o{background:#2d2438;color:#b58ce0}
  .ask{background:#241d12;border-color:#4a3a1c}
  .ask h3{margin:0 0 8px;font-size:13.5px;color:var(--warn)}
  .ask li{margin:5px 0;font-size:13.5px}
  .exp{background:#101c2b;border-color:#1e3a5c}
  .exp h3{margin:0 0 8px;font-size:13.5px;color:#6fb0ff}
  .exp .kv{display:grid;grid-template-columns:70px 1fr;gap:3px 10px;font-size:12.5px;margin-top:6px}
  .exp .k{color:var(--dim)}
  .foot{color:#5b6478;font-size:11.5px;margin-top:22px;line-height:1.7}
  .err{background:#2b1517;border-color:#5a2126;color:#ffb3ae}
</style>
</head>

async function run(){
  const q = document.getElementById("q").value.trim();
  const out = document.getElementById("out");
  if (!q) return;
  const hit = OFFLINE[q] || OFFLINE[Object.keys(OFFLINE).find(k => k.replace(/\s/g,"") === q.replace(/\s/g,""))];
  if (!hit){
    out.innerHTML = '<div class="card">离线快照里只有这几条，试试下面的示例：<br>' +
      Object.keys(OFFLINE).map(k => '· ' + k).join('<br>') + '</div>';
    return;
  }
  render(hit, 0);
}

function render(j, ms){
  const out = document.getElementById("out");
  let h = "";
  const m = j.mode || "ask";
  h += '<div class="meta"><span class="badge b-' + m + '">' + (MODE[m] || m) + '</span>'
     + '<span>' + (j.elapsed_ms ?? "—") + ' ms（含网络 ' + ms + ' ms）</span></div>';

  (j.candidates || []).forEach((c, i) => {
    h += '<div class="card">';
    h += '<div class="row1"><span class="sku">' + esc(c.sku_id) + '</span>'
       + '<span class="conf c-' + esc(c.confidence) + '">' + esc(c.confidence) + '</span></div>';
    h += '<div class="dims">' + esc((c.dims || {}).raw_text || "—") + '</div>';
    h += '<div class="reason">' + esc(c.reason) + '</div>';
    const ev = (c.evidence || [])[0];
    if (ev) h += '<div class="ev">出处：' + esc(ev.report_id) + ' 第 ' + esc(ev.page) + ' 页 · ' + esc(ev.snippet || "") + '</div>';
    let f = "";
    if (c.verified) f += '<span class="f f-v">已核对原文</span>';
    if (c.ocr) f += '<span class="f f-o">扫描图页识别</span>';
    f += '<span class="f">报价：询价确认</span>';
    h += '<div class="flags">' + f + '</div></div>';
  });

  (j.export_matches || []).forEach(e => {
    h += '<div class="card exp"><h3>海外对码 · ' + esc(e.kind).toUpperCase() + '</h3>';
    h += '<div class="row1"><span class="sku">' + esc(e.shoe_code) + '</span>'
       + '<span class="conf c-中">p' + esc(e.page) + '</span></div>';
    h += '<div class="kv">';
    if (e.fmsi) h += '<span class="k">FMSI</span><span>' + esc(e.fmsi) + '</span>';
    if (e.size) h += '<span class="k">尺寸</span><span>' + esc(e.size) + '</span>';
    if (e.oe_ref) h += '<span class="k">OE 号</span><span>' + esc(e.oe_ref) + '</span>';
    if (e.wva) h += '<span class="k">WVA</span><span>' + esc(e.wva) + '</span>';
    if (e.hardware) h += '<span class="k">硬件包</span><span>' + esc(e.hardware) + '</span>';
    h += '<span class="k">依据</span><span>' + esc(e.why) + '</span>';
    h += '</div>';
    h += '<div class="flags"><span class="f ' + (e.verified ? "f-v" : "") + '">'
       + (e.verified ? "已核对原文" : "册子上印着，未核对") + '</span></div></div>';
  });

  if ((j.followups || []).length){
    h += '<div class="card ask"><h3>需要确认（不猜）</h3><ul>';
    j.followups.forEach(q => h += '<li>' + esc(q) + '</li>');
    h += '</ul></div>';
  }
  if (!(j.candidates || []).length && !(j.export_matches || []).length && !(j.followups || []).length){
    h += '<div class="card">没查到，换个说法再试（车型 + 位置，或量三个尺寸）</div>';
  }
  out.innerHTML = h;
}

document.getElementById("go").onclick = run;
document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter") run(); });
Promise.resolve({json:()=>({skus:217,axles:7})}).then(r => r.json()).then(j => {
  document.getElementById("st").textContent = "已载入 " + j.skus + " 条型号 · " + j.axles + " 个车桥";
}).catch(() => {});
